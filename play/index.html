<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#102a30" />
    <title>Starlight Carnival</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Rye&family=DM+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #102829;
        color: #fff0ce;
      }
      body {
        overflow-x: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        touch-action: pan-y;
        outline: none;
      }
      canvas.play {
        touch-action: none;
      }
      canvas.in-settings {
        touch-action: none;
      }
      .sr {
        position: fixed;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      button:focus-visible {
        outline: 2px solid gold;
      }
    </style>
  </head>
  <body>
    <canvas
      id="stage"
      tabindex="0"
      aria-label="Starlight Carnival game"
    ></canvas>
    <div class="sr" id="access"></div>
    <div
      class="sr"
      id="announcer"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <script>
      "use strict";
      const cv = document.querySelector("canvas");
      let c = cv.getContext("2d");
      const TAU = Math.PI * 2,
        pi = Math.PI,
        cream = "#fff0ca",
        gold = "#e6b85d",
        ink = "#152e32",
        red = "#bd4339",
        teal = "#338984",
        violet = "#805985",
        cond = '"Barlow Condensed","Arial Narrow",sans-serif',
        display = "Rye,Georgia,serif",
        sans = '"DM Sans",Arial,sans-serif';
      let W,
        H,
        scale,
        mobile,
        screen = "title",
        modal = "",
        regions = [],
        hover = "",
        clock = 0,
        chosen = 0,
        hero = 0,
        mode = 0,
        practice = false,
        seed = 314159,
        mapScroll = 0,
        game,
        playing = true,
        last = 0,
        acc = 0,
        backgroundCache = new Map(),
        uiSignature = "",
        focusIndex = -1;
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x)),
        mix = (a, b, t) => a + (b - a) * t,
        range = (n) => Array.from({ length: n }, (_, i) => i),
        rng = (s) => () =>
          (s = (Math.imul(1664525, s) + 1013904223) >>> 0) / 4294967296;
      function path(d, fill, stroke, w = 1) {
        let p = new Path2D(d);
        if (fill) {
          c.fillStyle = fill;
          c.fill(p);
        }
        if (stroke) {
          c.strokeStyle = stroke;
          c.lineWidth = w;
          c.stroke(p);
        }
      }
      function poly(ps, f, s, w = 1) {
        c.beginPath();
        ps.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
        c.closePath();
        paint(f, s, w);
      }
      function paint(f, s, w = 1) {
        if (f) {
          c.fillStyle = f;
          c.fill();
        }
        if (s) {
          c.strokeStyle = s;
          c.lineWidth = w;
          c.stroke();
        }
      }
      function rect(x, y, w, h, f, s, l = 1, r = 0) {
        c.beginPath();
        c.roundRect(x, y, w, h, r);
        paint(f, s, l);
      }
      function oval(x, y, rx, ry, f, s, l = 1) {
        c.beginPath();
        c.ellipse(x, y, rx, ry, 0, 0, TAU);
        paint(f, s, l);
      }
      function line(x, y, a, b, col, w = 1) {
        c.beginPath();
        c.moveTo(x, y);
        c.lineTo(a, b);
        paint(null, col, w);
      }
      function star(x, y, r, n = 4, col = gold, inner = 0.36, stroke = null) {
        poly(
          range(n * 2).map((i) => [
            x + Math.cos((i * pi) / n - pi / 2) * r * (i % 2 ? inner : 1),
            y + Math.sin((i * pi) / n - pi / 2) * r * (i % 2 ? inner : 1),
          ]),
          col,
          stroke,
          1.2,
        );
      }
      function txt(
        t,
        x,
        y,
        size,
        f = cream,
        font = cond,
        weight = 700,
        align = "left",
        max,
      ) {
        c.font = weight + " " + size + "px " + font;
        c.textAlign = align;
        c.textBaseline = "middle";
        c.fillStyle = f;
        c.fillText(t, x, y, max);
      }
      function label(
        t,
        x,
        y,
        size = 12,
        col = gold,
        align = "left",
        spacing = 2,
      ) {
        c.save();
        c.letterSpacing = spacing + "px";
        txt(t, x, y, size, col, cond, 700, align);
        c.restore();
      }
      function local(x, y, s, fn) {
        c.save();
        c.translate(x, y);
        c.scale(s, s);
        fn();
        c.restore();
      }
      function framed(x, y, w, h, col = gold) {
        let k = 10;
        poly(
          [
            [x + k, y],
            [x + w - k, y],
            [x + w, y + k],
            [x + w, y + h - k],
            [x + w - k, y + h],
            [x + k, y + h],
            [x, y + h - k],
            [x, y + k],
          ],
          null,
          col,
          1.4,
        );
      }
      function button(id, x, y, w, h, fn, labelText = id) {
        regions.push({ id, x, y, w, h, fn, label: labelText });
        return hover === id || focusIndex === regions.length - 1;
      }
      function ctl(
        id,
        t,
        x,
        y,
        w,
        fn,
        primary = false,
        h = 40,
        enabled = true,
      ) {
        let hi = enabled && button(id, x, y, w, h, fn, t);
        if (!enabled) {
          rect(x, y, w, h, "#254045", "#64736b", 1, 4);
          txt(t, x + w / 2, y + h / 2, 16, "#b0b8a8", cond, 600, "center");
          return;
        }

        rect(
          x,
          y,
          w,
          h,
          hi ? "#f0cb83" : primary ? gold : "#1e4144",
          gold,
          1,
          4,
        );
        txt(
          t,
          x + w / 2,
          y + h / 2,
          18,
          hi || primary ? ink : cream,
          cond,
          700,
          "center",
        );
      }
      const worlds = [
          "Comet Grounds",

          ["#164748", "#674635", "#c08a54"],
          ["#16505b", "#287d80", "#ee967a"],
          ["#312341", "#773958", "#c8a1cf"],
          ["#453039", "#8c4e3e", "#e7af58"],
          ["#153e38", "#39614e", "#d9a66a"],
          ["#152c51", "#384a75", "#91d7c6"],
        ];
      const titles = [
        "First Spark",
        "Ribbon Run",
        "Tent Top Tumble",
        "Courier’s Shortcut",
        "Light the Marquee",

      const modes = [

      ];
      const qualityPresets = {
        low: {
          name: "Low",
          density: 0.3,
          dpr: 1,
          trail: 4,
          description: "Short trails and fewer sparks",
        },
        balanced: {
          name: "Balanced",
          density: 0.65,
          dpr: 1.5,
          trail: 7,
          description: "Soft trails and moderate effects",
        },
        high: {
          name: "High",
          density: 1,
          dpr: 2,
          trail: 10,
          description: "Full trails, sparks and pearl glow",
        },
      };
      function readSave() {
        let d = {
          stars: Array(40).fill(0),
          medals: Array(40).fill(0),
          best: Array(40).fill(0),
          attack: Array(40).fill(0),
          sound: false,
          musicOn: true,
          effectsOn: true,
          music: 0.45,
          effects: 0.7,
          quality: "high",
          contrast: false,
          reduced: matchMedia("(prefers-reduced-motion: reduce)").matches,
          symbols: true,
        };
        try {
          let a = JSON.parse(localStorage.getItem("starlight.v1"));
          if (a)
            for (let k in d) {
              if (Array.isArray(d[k]) && Array.isArray(a[k]))
                d[k] = d[k].map((_, i) =>
                  clamp(
                    Math.floor(Number(a[k][i])) || 0,
                    0,
                    k === "stars" ? 3 : k === "medals" ? 7 : 1e9,
                  ),
                );
              else if (k === "quality") {
                if (
                  typeof a[k] === "string" &&
                  Object.hasOwn(qualityPresets, a[k])
                )
                  d[k] = a[k];
              } else if (typeof a[k] === typeof d[k] && !Array.isArray(d[k]))
                d[k] = typeof d[k] === "number" ? clamp(a[k], 0, 1) : a[k];
            }
        } catch {}
        return d;
      }
      let save = readSave();
      function persist() {
        try {
          localStorage.setItem("starlight.v1", JSON.stringify(save));
        } catch {}
      }
      function unlocked() {
        let i = save.stars.findIndex((v) => !v);
        return i < 0 ? 39 : i;
      }
      function ticket(x, y, s = 1, col = gold) {
        local(x, y, s, () => {
          c.rotate(-0.29);
          let d = "M-21 -12H21V-5Q12 0 21 5V12H-21V5Q-12 0 -21 -5Z";
          path(d, col, ink, 1.5);
          rect(-13, -8, 26, 16, null, ink, 1);
          star(0, 0, 6, 5, ink, 0.45);
        });
      }
      function wheel(x, y, r, a = 0, col = "#bc975f") {
        c.save();
        line(x - r * 0.44, y + r * 1.39, x, y, col, 4);
        line(x + r * 0.44, y + r * 1.39, x, y, col, 4);
        oval(x, y, r, r, null, col, 2.8);
        oval(x, y, r * 0.86, r * 0.86, null, col, 1);
        for (let i = 0; i < 12; i++) {
          let t = (TAU * i) / 12 + a,
            X = x + Math.cos(t) * r,
            Y = y + Math.sin(t) * r;
          line(x, y, X, Y, col, 1.5);
          const cabin = clamp(r * 0.074, 3, 10);
          line(X, Y, X - cabin * 0.65, Y + cabin * 0.86, col, 1);
          line(X, Y, X + cabin * 0.65, Y + cabin * 0.86, col, 1);
          rect(
            X - cabin,
            Y + cabin * 0.82,
            cabin * 2,
            cabin * 1.17,
            i % 2 ? "#bc7858" : "#72958a",
            col,
            1,
            2,
          );
          rect(
            X - cabin * 0.62,
            Y + cabin,
            cabin * 1.24,
            cabin * 0.25,
            "#e9c48b",
          );
          oval(X, Y, 1.6, 1.6, "#f4d6a1");
        }
        oval(x, y, 5, 5, col);
        c.restore();
      }
      function tent(x, y, w, h, a = "#c45844", b = "#edbd73") {
        local(x, y, 1, () => {
          let apex = -h;
          rect(-w * 0.43, -h * 0.4, w * 0.86, h * 0.4, a);
          for (let j = 0; j < 7; j++) {
            let l = -w / 2 + (j * w) / 7,
              r = l + w / 7;
            path(
              "M0 " +
                apex +
                " Q" +
                l * 0.52 +
                " " +
                -h * 0.55 +
                " " +
                l +
                " " +
                -h * 0.4 +
                " Q" +
                (l + r) / 2 +
                " " +
                -h * 0.3 +
                " " +
                r +
                " " +
                -h * 0.4 +
                " Q" +
                r * 0.52 +
                " " +
                -h * 0.55 +
                " 0 " +
                apex,
              j % 2 ? a : b,
            );
            if (j % 2 === 0)
              rect(l + w * 0.055, -h * 0.36, w * 0.08, h * 0.36, b);
          }
          for (let j = 0; j < 7; j++) {
            const l = -w / 2 + (j * w) / 7,
              r = l + w / 7;
            const shade = c.createLinearGradient(l, 0, r, 0);
            shade.addColorStop(0, "#3d30342e");
            shade.addColorStop(0.7, "#fff0c305");
            shade.addColorStop(1, "#3d303430");
            path(
              "M0 " +
                apex +
                "Q" +
                l * 0.52 +
                " " +
                -h * 0.55 +
                " " +
                l +
                " " +
                -h * 0.4 +
                "Q" +
                (l + r) / 2 +
                " " +
                -h * 0.29 +
                " " +
                r +
                " " +
                -h * 0.4 +
                "Q" +
                r * 0.52 +
                " " +
                -h * 0.55 +
                " 0 " +
                apex,
              shade,
            );
            oval((l + r) / 2, -h * 0.35, 1.5, 2, "#ffdfa1");
          }
          poly(
            [
              [-w * 0.12, 0],
              [0, -h * 0.34],
              [w * 0.12, 0],
            ],
            "#243337",
          );
          line(0, apex, 0, apex - 15, b, 1.5);
          poly(
            [
              [0, apex - 16],
              [17, apex - 13],
              [0, apex - 7],
            ],
            a,
          );
        });
      }
      function icon(i, x, y, s, col = gold) {
        local(x, y, s, () => {
          if (i === 0) {
            tent(0, 18, 55, 34, col, "#fff0cd");
          }
          if (i === 1) {
            ticket(-5, 1, 1.12, col);
            c.rotate(0.39);
            ticket(4, -3, 0.91, "#fff0cd");
          }
          if (i === 2) {
            path("M-13 -14H13L10 0Q8 10 0 12Q-8 9 -10 0Z", col);
            path("M-13 -9H-21Q-21 4 -9 4M13 -9H21Q21 4 9 4", null, col, 3);
            rect(-2, 9, 4, 9, col);
            rect(-11, 18, 22, 3, col);
            star(0, -3, 5, 5, ink);
          }
          if (i === 3) {
            c.rotate(-0.19);
            rect(-16, -15, 28, 28, col, ink, 1, 4);
            for (let [x, y] of [
              [-9, -8],
              [4, -8],
              [-3, -1],
              [-9, 6],
              [4, 6],

            c.rotate(0.5);
            rect(7, -8, 17, 17, "#fff1ca", ink, 1, 3);
            oval(15, 0, 2, 2, ink);
          }
        });
      }
      // Layered hand-drawn carnival cast. Local space runs from hat (-110) to boots (+84).

              "#54405f",
              "#997635",

              "#707c9e",
              "#b16e43",
              "#3d939a",

              "#887753",
              "#467c58",

            edge = "#372f32";

              i === 2

          d("M-19 -6Q-33 7 -46 0L-54 -9L-64 -2Q-56 25 -30 25L-14 16Z", coat);
          d(
            "M-52 -8Q-59 -25 -64 -20Q-66 -17 -61 -10Q-74 -19 -76 -12Q-77 -3 -65 3Q-58 7 -52 -1Z",
            "#f7d99d",
          );

          d(
            "M38 -28Q35 -38 40 -43Q43 -45 44 -35Q52 -49 57 -46Q60 -42 52 -33Q65 -39 65 -33Q58 -22 47 -21Z",
            "#f7d99d",
          );

          d("M-9 -8L6 -8L13 36L-8 40Z", "#f5c171");
          for (let j = 0; j < 3; j++)

          path("M-25 31Q3 39 24 28L25 35Q2 45 -25 38Z", "#644a3d");
          rect(-3, 35, 10, 7, null, gold, 2);
          if (i === 0) {

              oval(e * 29, -63, 14, 15, fur, edge, 2);

          if (
            !game.active &&
            ["ArrowLeft", "ArrowRight"].includes(e.key) &&
            !e.repeat
          ) {
            aimHeld = e.key === "ArrowLeft" ? -1 : 1;
            aimHeldAt = performance.now();
            game.angle = clamp(
              game.angle + aimHeld * (aimFine ? 0.004 : 0.024),
              -1.34,
              1.34,
            );
          }
          if (e.key.toLowerCase() === "r") modal = "restart";
        } else if (screen === "map" && !modal) {
          const { top, bottom, max } = mapMetrics(),
            page = bottom - top;
          const offset = {
            ArrowDown: 70,
            ArrowUp: -70,
            PageDown: page,
            PageUp: -page,
            Home: -max,
            End: max,
          }[e.key];
          if (offset !== undefined) {
            e.preventDefault();
            mapAnchor = null;
            mapVelocity = 0;
            mapScroll = clamp(mapScroll + offset, 0, max);
          }
        }
        render();
      });
      document.addEventListener("visibilitychange", () => {
        last = 0;
        acc = 0;
        if (document.hidden) {
          if (finger?.slider) persist();
          finger = null;
          mapVelocity = 0;
          stopAiming();
          suspendAudio();
          if (encore) encore.running = false;
          if (screen === "play" && !modal) modal = "pause";
        } else if (!modal && ac) wake();
      });
      window.addEventListener("resize", resize);
      Promise.allSettled([
        document.fonts.load("bold 96px Rye"),
        document.fonts.load("700 16px " + cond),
        document.fonts.load("400 14px " + sans),
      ]).then(() => backgroundCache.delete("poster"));
      // The carnival site can hand visitors directly to a mission or a mode's map.
      function enterFromTicket() {
        const ticket = new URLSearchParams(location.search);
        const selected = [
          "adventure",
          "free-play",
          "score-attack",
          "seeded",
        ].indexOf(ticket.get("mode"));
        if (selected < 0) return;
        mode = selected;
        if (mode === 0) {
          chosen = unlocked();
          hero = Math.floor(chosen / 5);
          start(false);
        } else if (mode === 1 && /^[1-8]$/.test(ticket.get("world") || "")) {
          hero = Number(ticket.get("world")) - 1;
          chosen = hero * 5;
          start(false);
        } else openMap(mode);
      }
      resize();
      enterFromTicket();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
