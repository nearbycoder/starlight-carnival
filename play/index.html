<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#102a30" />
    <title>Starlight Carnival</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Rye&family=DM+Sans:wght@400;600;700&display=swap"
      id="stage-fonts"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <style>
      :root {
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #102829;
        color: #fff0ce;
      }
      body {
        overflow-x: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        touch-action: pan-y;
        outline: none;
      }
      canvas.play {
        touch-action: none;
      }
      canvas.in-settings {
        touch-action: none;
      }
      .sr {
        position: fixed;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      button:focus-visible {
        outline: 2px solid gold;
      }
    </style>
  </head>
  <body>
    <canvas
      id="stage"
      tabindex="0"
      aria-label="Starlight Carnival game"
      aria-describedby="screen-description"
    ></canvas>
    <div class="sr" id="screen-description"></div>
    <div class="sr" id="access"></div>
    <div
      class="sr"
      id="announcer"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <script>
      "use strict";
      const cv = document.querySelector("canvas");
      let c = cv.getContext("2d");
      const TAU = Math.PI * 2,
        pi = Math.PI,
        cream = "#fff0ca",
        gold = "#e6b85d",
        ink = "#152e32",
        red = "#bd4339",
        teal = "#338984",
        violet = "#805985",
        cond = '"Barlow Condensed","Arial Narrow",sans-serif',
        display = "Rye,Georgia,serif",
        sans = '"DM Sans",Arial,sans-serif';
      let W,
        H,
        scale,
        mobile,
        screen = "title",
        modal = "",
        regions = [],
        hover = "",
        clock = 0,
        chosen = 0,
        hero = 0,
        mode = 0,
        practice = false,
        seed = 314159,
        mapScroll = 0,
        game,
        playing = true,
        last = 0,
        acc = 0,
        backgroundCache = new Map(),
        uiSignature = "",
        focusIndex = -1;
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x)),
        mix = (a, b, t) => a + (b - a) * t,
        range = (n) => Array.from({ length: n }, (_, i) => i),
        rng = (s) => () =>
          (s = (Math.imul(1664525, s) + 1013904223) >>> 0) / 4294967296;
      function path(d, fill, stroke, w = 1) {
        let p = new Path2D(d);
        if (fill) {
          c.fillStyle = fill;
          c.fill(p);
        }
        if (stroke) {
          c.strokeStyle = stroke;
          c.lineWidth = w;
          c.stroke(p);
        }
      }
      function poly(ps, f, s, w = 1) {
        c.beginPath();
        ps.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y)));
        c.closePath();
        paint(f, s, w);
      }
      function paint(f, s, w = 1) {
        if (f) {
          c.fillStyle = f;
          c.fill();
        }
        if (s) {
          c.strokeStyle = s;
          c.lineWidth = w;
          c.stroke();
        }
      }
      function rect(x, y, w, h, f, s, l = 1, r = 0) {
        c.beginPath();
        c.roundRect(x, y, w, h, r);
        paint(f, s, l);
      }
      function oval(x, y, rx, ry, f, s, l = 1) {
        c.beginPath();
        c.ellipse(x, y, rx, ry, 0, 0, TAU);
        paint(f, s, l);
      }
      function line(x, y, a, b, col, w = 1) {
        c.beginPath();
        c.moveTo(x, y);
        c.lineTo(a, b);
        paint(null, col, w);
      }
      function star(x, y, r, n = 4, col = gold, inner = 0.36, stroke = null) {
        poly(
          range(n * 2).map((i) => [
            x + Math.cos((i * pi) / n - pi / 2) * r * (i % 2 ? inner : 1),
            y + Math.sin((i * pi) / n - pi / 2) * r * (i % 2 ? inner : 1),
          ]),
          col,
          stroke,
          1.2,
        );
      }
      function txt(
        t,
        x,
        y,
        size,
        f = cream,
        font = cond,
        weight = 700,
        align = "left",
        max,
      ) {
        c.font = weight + " " + size + "px " + font;
        c.textAlign = align;
        c.textBaseline = "middle";
        c.fillStyle = f;
        c.fillText(t, x, y, max);
      }
      function label(
        t,
        x,
        y,
        size = 12,
        col = gold,
        align = "left",
        spacing = 2,
      ) {
        c.save();
        c.letterSpacing = spacing + "px";
        txt(t, x, y, size, col, cond, 700, align);
        c.restore();
      }
      function local(x, y, s, fn) {
        c.save();
        c.translate(x, y);
        c.scale(s, s);
        fn();
        c.restore();
      }
      function framed(x, y, w, h, col = gold) {
        let k = 10;
        poly(
          [
            [x + k, y],
            [x + w - k, y],
            [x + w, y + k],
            [x + w, y + h - k],
            [x + w - k, y + h],
            [x + k, y + h],
            [x, y + h - k],
            [x, y + k],
          ],
          null,
          col,
          1.4,
        );
      }
      function button(id, x, y, w, h, fn, labelText = id) {
        regions.push({ id, x, y, w, h, fn, label: labelText });
        return hover === id || focusIndex === regions.length - 1;
      }
      function ctl(
        id,
        t,
        x,
        y,
        w,
        fn,
        primary = false,
        h = 40,
        enabled = true,
      ) {
        let hi = enabled && button(id, x, y, w, h, fn, t);
        if (!enabled) {
          rect(x, y, w, h, "#254045", "#64736b", 1, 4);
          txt(t, x + w / 2, y + h / 2, 16, "#b0b8a8", cond, 600, "center");
          return;
        }

        rect(
          x,
          y,
          w,
          h,
          hi ? "#f0cb83" : primary ? gold : "#1e4144",
          gold,
          1,
          4,
        );
        txt(
          t,
          x + w / 2,
          y + h / 2,
          18,
          hi || primary ? ink : cream,
          cond,
          700,
          "center",
        );
      }
      const worlds = [

        ],
        desc = [

          ["#164748", "#674635", "#c08a54"],
          ["#16505b", "#287d80", "#ee967a"],
          ["#312341", "#773958", "#c8a1cf"],
          ["#453039", "#8c4e3e", "#e7af58"],

      const titles = [

      ];
      const missionCues = [
        "Clear every orange sun before the pearls run out.",
        "Follow a ribbon. The violet star changes places after each shot.",
        "Bank off a side rail to reach the far tent roofs.",
        "Aim past the post and into a side pocket.",
        "Work across the marquee to bring its letters back to light.",

        "Watch the pendulum swing before you release.",
        "Send a pearl under either end of the silver arches.",
        "Let the wheel bring a sun into your line of fire.",

        "The brass posts stay onstage. Use their rebound.",
        "Hit a green diamond to send sparks into both engines.",
        "Look for a path where two gear rims nearly meet.",
        "Wait for the rotor to open a route into a corner.",
        "Skim a row and let a bubble lift the pearl back.",
        "Lead the moving bell of a jellyfish by a little.",
        "Follow a coral branch down to the next fork.",
        "The blue current bends your shot in the direction of its flow.",
        "Pick a passing hull and follow its keel.",
        "Strike a green diamond in the middle of a rosette.",
        "Shoot through the gap as a brass gate slides away.",
        "Choose a wing and work toward the mirror.",
        "Watch the upper gate before aiming at the lower chamber.",
        "Send a pearl through the crown and into its chamber.",
        "Prime a meteor, then aim it through a stack of bricks.",
        "Try a glancing shot down the side of a bell tower.",
        "Bank off an anvil to cross from one lane to the next.",
        "Follow the orange bridges between clusters.",
        "Strike the gong and follow the pearl into the outer ring.",
        "Follow the steps. A green diamond grows a vine below.",
        "Enter the spiral through a gap between its arms.",
        "Approach the sheltered suns from beside a mushroom cap.",
        "Aim just ahead of a drifting cluster of fruit.",
        "Use the gaps between turning petals to reach the heart.",
        "Link the suns with a diamond, then strike any linked sun.",
        "Watch which way each of the two currents bends your shot.",
        "When the rings line up, thread the hands of the clock.",
        "Choose a side lane while the centre gate is closed.",
        "Clear the lantern one pane at a time to relight the carnival.",
      ];
      const modes = [
        "Adventure",
        "Free Play",
        "Score Attack",
        "Seeded Challenge",
      ];
      const qualityPresets = {
        low: {
          name: "Low",
          density: 0.3,
          dpr: 1,
          pixels: 3e6,
          trail: 4,
          description: "Short trails and fewer sparks",
        },
        balanced: {
          name: "Balanced",
          density: 0.65,
          dpr: 1.5,
          pixels: 6e6,
          trail: 7,
          description: "Soft trails and moderate effects",
        },
        high: {
          name: "High",
          density: 1,
          dpr: 2,
          pixels: 10e6,
          trail: 10,
          description: "Full trails, sparks and pearl glow",
        },
      };
      function rankedRuns(entries) {
        const unique = new Map();
        for (const r of entries) {
          if (
            !r ||
            typeof r.id !== "string" ||
            !r.id.length ||
            r.id.length > 100 ||
            !Number.isSafeInteger(r.score) ||
            r.score < 0 ||
            r.score > 1e9
          )
            continue;
          if (r.id === "legacy") {
            unique.set(r.id, {
              id: r.id,
              score: Math.max(unique.get(r.id)?.score || 0, r.score),
            });
            continue;
          }
          if (
            !Number.isInteger(r.h) ||
            r.h < 0 ||
            r.h > 7 ||
            !Number.isSafeInteger(r.shots) ||
            r.shots < 1 ||
            r.shots > 10000 ||
            !Number.isInteger(r.chain) ||
            r.chain < 0 ||
            r.chain > 120 ||
            typeof r.clear !== "boolean"
          )
            continue;
          unique.set(r.id, {
            id: r.id,
            h: r.h,
            score: r.score,
            shots: r.shots,
            chain: r.chain,
            clear: r.clear,
          });
        }
        return [...unique.values()]
          .sort(
            (a, b) =>
              b.score - a.score ||
              (a.shots ?? Infinity) - (b.shots ?? Infinity) ||
              (a.id < b.id ? -1 : 1),
          )
          .slice(0, 5);
      }
      function readSave() {
        let d = {
          stars: Array(40).fill(0),
          medals: Array(40).fill(0),
          best: Array(40).fill(0),
          attack: Array(40).fill(0),
          ranks: range(40).map(() => []),
          sound: false,
          musicOn: true,
          effectsOn: true,
          music: 0.45,
          effects: 0.7,
          quality: "high",
          contrast: false,
          reduced: matchMedia("(prefers-reduced-motion: reduce)").matches,
          symbols: true,
        };
        try {
          let a = JSON.parse(localStorage.getItem("starlight.v1"));
          if (a)
            for (let k in d) {
              if (k === "ranks") {
                if (Array.isArray(a.ranks))
                  d.ranks = d.ranks.map((_, n) =>
                    Array.isArray(a.ranks[n])
                      ? rankedRuns(a.ranks[n].slice(0, 10))
                      : [],
                  );
              } else if (Array.isArray(d[k]) && Array.isArray(a[k]))
                d[k] = d[k].map((_, i) =>
                  clamp(
                    Math.floor(Number(a[k][i])) || 0,
                    0,
                    k === "stars" ? 3 : k === "medals" ? 7 : 1e9,
                  ),
                );
              else if (k === "quality") {
                if (
                  typeof a[k] === "string" &&
                  Object.hasOwn(qualityPresets, a[k])
                )
                  d[k] = a[k];
              } else if (typeof a[k] === typeof d[k] && !Array.isArray(d[k]))
                d[k] = typeof d[k] === "number" ? clamp(a[k], 0, 1) : a[k];
            }
        } catch {}
        for (let n = 0; n < 40; n++) {
          const top = d.ranks[n][0]?.score || 0;
          if (d.attack[n] > top)
            d.ranks[n] = rankedRuns([
              ...d.ranks[n],
              { id: "legacy", score: d.attack[n] },
            ]);
          if (d.attack[n] < top) d.attack[n] = top;
        }
        return d;
      }
      const preferenceKeys = [
        "sound",
        "musicOn",
        "effectsOn",
        "music",
        "effects",
        "quality",
        "contrast",
        "reduced",
        "symbols",
      ];
      let save = readSave(),
        savedPreferences = { ...save };
      function combineProgress(other) {
        for (let n = 0; n < titles.length; n++) {
          const medals = savedMedals(save, n) | savedMedals(other, n);
          save.medals[n] = medals;
          save.stars[n] = medalCount(medals);
          save.best[n] = Math.max(save.best[n], other.best[n]);
          save.attack[n] = Math.max(save.attack[n], other.attack[n]);
          if (save.ranks[n].length || other.ranks[n].length)
            save.ranks[n] = rankedRuns([...other.ranks[n], ...save.ranks[n]]);

      }
      function mergeSave(other) {
        combineProgress(other);

        for (const key of preferenceKeys) {
          if (save[key] === savedPreferences[key]) save[key] = other[key];

      function persist() {
        try {
          mergeSave(readSave());
          localStorage.setItem("starlight.v1", JSON.stringify(save));
          savedPreferences = { ...save };
        } catch {}

      window.addEventListener("storage", (event) => {
        if (event.key === checkpointKey) {
          intermissionTicket = resumeTicket();

        }
        if (event.key !== "starlight.v1" || !event.newValue) return;

          quality = save.quality;

          mixLevel("effects");
          mixLevel("music");
          if (!save.sound) suspendAudio();
        }
        // Concurrent completions can originate before either write was seen.
        if (
          save.medals.some(
            (v, n) =>
              v !== savedMedals(other, n) ||
              save.best[n] > other.best[n] ||
              save.attack[n] > other.attack[n] ||
              save.ranks[n].some(
                (row) => !other.ranks[n].some((theirs) => theirs.id === row.id),

          )

          persist();
      });
      function unlocked() {
        let i = save.stars.findIndex((v) => !v);
        return i < 0 ? 39 : i;
      }
      function ticket(x, y, s = 1, col = gold) {
        local(x, y, s, () => {
          c.rotate(-0.29);
          let d = "M-21 -12H21V-5Q12 0 21 5V12H-21V5Q-12 0 -21 -5Z";
          path(d, col, ink, 1.5);
          rect(-13, -8, 26, 16, null, ink, 1);
          star(0, 0, 6, 5, ink, 0.45);
        });
      }
      function wheel(x, y, r, a = 0, col = "#bc975f") {
        c.save();
        line(x - r * 0.44, y + r * 1.39, x, y, col, 4);
        line(x + r * 0.44, y + r * 1.39, x, y, col, 4);
        oval(x, y, r, r, null, col, 2.8);
        oval(x, y, r * 0.86, r * 0.86, null, col, 1);
        for (let i = 0; i < 12; i++) {
          let t = (TAU * i) / 12 + a,
            X = x + Math.cos(t) * r,
            Y = y + Math.sin(t) * r;
          line(x, y, X, Y, col, 1.5);
          const cabin = clamp(r * 0.074, 3, 10);
          line(X, Y, X - cabin * 0.65, Y + cabin * 0.86, col, 1);
          line(X, Y, X + cabin * 0.65, Y + cabin * 0.86, col, 1);
          rect(
            X - cabin,
            Y + cabin * 0.82,
            cabin * 2,
            cabin * 1.17,
            i % 2 ? "#bc7858" : "#72958a",
            col,
            1,
            2,
          );
          rect(
            X - cabin * 0.62,
            Y + cabin,
            cabin * 1.24,
            cabin * 0.25,
            "#e9c48b",

          oval(X, Y, 1.6, 1.6, "#f4d6a1");

      function tent(x, y, w, h, a = "#c45844", b = "#edbd73") {

          let apex = -h;

          for (let j = 0; j < 7; j++) {
            let l = -w / 2 + (j * w) / 7,
              r = l + w / 7;

              "M0 " +
                apex +
                " Q" +
                l * 0.52 +
                " " +
                -h * 0.55 +
                " " +
                l +
                " " +
                -h * 0.4 +
                " Q" +
                (l + r) / 2 +
                " " +
                -h * 0.3 +
                " " +
                r +
                " " +
                -h * 0.4 +
                " Q" +
                r * 0.52 +
                " " +
                -h * 0.55 +
                " 0 " +
                apex,
              j % 2 ? a : b,

            if (j % 2 === 0)
              rect(l + w * 0.055, -h * 0.36, w * 0.08, h * 0.36, b);

          for (let j = 0; j < 7; j++) {
            const l = -w / 2 + (j * w) / 7,
              r = l + w / 7;

            shade.addColorStop(0, "#3d30342e");
            shade.addColorStop(0.7, "#fff0c305");
            shade.addColorStop(1, "#3d303430");
            path(
              "M0 " +
                apex +
                "Q" +
                l * 0.52 +
                " " +
                -h * 0.55 +
                " " +
                l +
                " " +
                -h * 0.4 +
                "Q" +
                (l + r) / 2 +
                " " +
                -h * 0.29 +
                " " +
                r +
                " " +
                -h * 0.4 +
                "Q" +
                r * 0.52 +
                " " +
                -h * 0.55 +
                " 0 " +
                apex,
              shade,
            );
            oval((l + r) / 2, -h * 0.35, 1.5, 2, "#ffdfa1");
          }
          poly(
            [
              [-w * 0.12, 0],
              [0, -h * 0.34],
              [w * 0.12, 0],
            ],
            "#243337",
          );
          line(0, apex, 0, apex - 15, b, 1.5);
          poly(
            [
              [0, apex - 16],
              [17, apex - 13],
              [0, apex - 7],
            ],
            a,
          );
        });
      }
      function icon(i, x, y, s, col = gold) {
        local(x, y, s, () => {
          if (i === 0) {

        if (
          (e.key === "ArrowLeft" && aimHeld < 0) ||
          (e.key === "ArrowRight" && aimHeld > 0)
        )
          stopAiming();
      });
      window.addEventListener("blur", stopAiming);
      cv.onpointerdown = (e) => {
        keyboardIntent = false;
        if (!e.isPrimary || e.button !== 0) return;
        directPointer = e.pointerType !== "mouse";
        if (save.sound && ac?.state !== "running") wake();
        let p = pt(e);
        if (screen === "map") mapVelocity = 0;
        finger = {
          ...p,
          pointerId: e.pointerId,
          lastTime: performance.now(),
          last: p.y,
          id: target(p)?.id,
          drag: false,
        };
        const slider = target(p);
        if (slider?.slider) {
          finger.slider = slider.slider;
          cv.setPointerCapture(e.pointerId);
          dragVolume(p);
          return;
        }
        if (encore && finger.id === "encoreSeek") {
          cv.setPointerCapture(e.pointerId);
          finger.resume = encore.running;
          encore.running = false;
          seekEncore(
            ((p.x - encore.track.x) / encore.track.w) * encore.source.ticks,
          );
          return;
        }
        if (
          e.pointerType === "touch" &&
          (screen === "map" || screen === "play")
        )
          cv.setPointerCapture(e.pointerId);
        if (
          screen === "play" &&
          !modal &&
          !target(p) &&
          !boardBox.hud?.some(
            (box) =>
              p.x >= box.x &&
              p.x <= box.x + box.w &&
              p.y >= box.y &&
              p.y <= box.y + box.h,
          ) &&
          p.y >= boardBox.y &&
          p.y < boardBox.y + 650 * boardBox.s
        ) {
          if (!game.active) aim(p);
          if (e.pointerType === "mouse") fire();
        }
      };
      cv.onpointermove = (e) => {
        if (!e.isPrimary) return;
        let p = pt(e),
          b = target(p);
        hover = b?.id || "";
        cv.style.cursor = b
          ? "pointer"
          : screen === "play" && !modal
            ? "crosshair"
            : "default";
        if (finger && Math.hypot(p.x - finger.x, p.y - finger.y) > 6)
          finger.drag = true;
        if (finger?.slider) {
          dragVolume(p);
          return;
        }
        if (encore && finger?.id === "encoreSeek") {
          seekEncore(
            ((p.x - encore.track.x) / encore.track.w) * encore.source.ticks,
          );
          return;
        }
        if (screen === "map" && finger && !modal) {
          const dy = finger.last - p.y,
            now = performance.now();
          if (dy) mapAnchor = null;
          mapScroll = clamp(mapScroll + dy, 0, mapMetrics().max);
          if (e.pointerType === "touch" && !save.reduced)
            mapVelocity = clamp(
              dy / Math.max(0.012, (now - finger.lastTime) / 1000),
              -1950,
              1950,
            );
          finger.last = p.y;
          finger.lastTime = now;
        }
        if (
          screen === "play" &&
          !modal &&
          !game.active &&
          !b &&
          (e.pointerType === "mouse" || (finger && !finger.id)) &&
          p.y > boardBox.y &&
          p.y < boardBox.y + BH * boardBox.s
        )
          aim(p);
      };
      cv.onpointerup = (e) => {
        if (!finger || e.pointerId !== finger.pointerId) return;
        if (finger.slider) {
          dragVolume(pt(e));
          persist();
          finger = null;
          return;
        }
        if (encore && finger.id === "encoreSeek") {
          encore.running = !!finger.resume && encore.tick < encore.source.ticks;
          finger = null;
          return;
        }
        if (screen === "map" && performance.now() - finger.lastTime > 90)
          mapVelocity = 0;
        let b = target(pt(e));
        if (b && finger && !finger.drag && finger.id === b.id) {
          b.fn();
          render();
        }
        finger = null;
      };
      cv.onpointercancel = (e) => {
        if (finger?.pointerId === e.pointerId) {
          if (finger.slider) persist();
          finger = null;
        }
      };
      cv.addEventListener(
        "wheel",
        (e) => {
          if (screen === "map" && !modal) {
            e.preventDefault();
            mapAnchor = null;
            mapVelocity = 0;
            const { top, bottom, max } = mapMetrics();
            const unit =
              e.deltaMode === 1
                ? 16
                : e.deltaMode === 2
                  ? bottom - top
                  : 1 / scale;
            mapScroll = clamp(mapScroll + e.deltaY * unit, 0, max);
          }
        },
        { passive: false },
      );
      window.addEventListener("keydown", (e) => {
        keyboardIntent = true;
        if (e.key === "Tab" && modal) {
          const el = document.getElementById("access"),
            first = el.firstElementChild,
            final = el.lastElementChild;
          if (
            !el.contains(document.activeElement) ||
            document.activeElement === (e.shiftKey ? first : final)
          ) {
            e.preventDefault();
            (e.shiftKey ? final : first)?.focus({ preventScroll: true });
            return;
          }
        }
        if (save.sound && ac?.state !== "running") wake();
        if (modal === "settings") {
          if (
            [
              "ArrowDown",
              "ArrowUp",
              " ",
              "PageDown",
              "PageUp",
              "Home",
              "End",
            ].includes(e.key) &&
            !["INPUT", "BUTTON"].includes(e.target.tagName)
          )
            e.preventDefault();
          if (e.key === "Escape") {
            e.preventDefault();
            if (finger?.slider) {
              persist();
              finger = null;
            }
            closeSettings();
            render();
          }
          return;
        }
        if (encore) {
          if (e.key === "Escape") {
            e.preventDefault();
            closeEncore();
            render();
            return;
          }
          if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
            e.preventDefault();
            seekEncore(
              encore.tick +
                (e.key === "ArrowLeft" ? -1 : 1) * Math.round(1 / DT),
            );
            render();
            return;
          }
          if (e.key === " " && e.target.tagName !== "BUTTON") {
            e.preventDefault();
            if (!e.repeat) toggleEncore();
            return;
          }
          return;
        }
        if (
          modal === "seed" &&
          document.activeElement?.tagName !== "BUTTON" &&
          (/^[0-9]$/.test(e.key) ||
            ["Backspace", "Enter", "Escape"].includes(e.key))
        ) {
          e.preventDefault();
          seedKey(e.key);
          render();
          return;
        }
        if (
          screen === "title" &&
          !modal &&
          e.key === "Enter" &&
          !e.repeat &&
          (e.target === cv || e.target === document.body)
        ) {
          e.preventDefault();
          enterAdventure();
          render();
          return;
        }
        if (e.target.tagName === "BUTTON" && ["Enter", " "].includes(e.key))
          return;
        if (
          ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(
            e.key,
          )
        )
          e.preventDefault();
        if (e.key === "Escape") {
          if (modal === "scorebook") {
            closeScorebook();
            render();
            return;
          }
          if (modal === "guide") {
            closeGuide();
            render();
            return;
          }
          if (modal === "receipt") {
            closeReceipt();
            render();
            return;
          }
          if (modal === "results") return;
          if (modal) modal = "";
          else if (screen === "play") modal = "pause";
          else if (screen === "select") go("map");
          else go("title");
        } else if (screen === "play" && !modal) {
          if (e.key === " " && !e.repeat) fire();
          if (e.key.toLowerCase() === "f" && !e.repeat) changePace();
          if (
            e.key.toLowerCase() === "m" &&
            !e.repeat &&
            !e.metaKey &&
            !e.ctrlKey
          )
            toggleSound();
          if (e.key.toLowerCase() === "i" && !e.repeat) readAim(game);
          aimFine = e.shiftKey;
          if (
            !game.active &&
            ["ArrowLeft", "ArrowRight"].includes(e.key) &&
            !e.repeat
          ) {
            aimHeld = e.key === "ArrowLeft" ? -1 : 1;
            aimHeldAt = performance.now();
            game.dialUntil = game.time + 1.8;
            game.angle = clamp(
              game.angle + aimHeld * (aimFine ? 0.004 : 0.024),
              -1.34,
              1.34,
            );
          }
          if (e.key.toLowerCase() === "r") modal = "restart";
        } else if (screen === "map" && !modal) {
          const { top, bottom, max } = mapMetrics(),
            page = bottom - top;
          const offset = {
            ArrowDown: 70,
            ArrowUp: -70,
            PageDown: page,
            PageUp: -page,
            Home: -max,
            End: max,
          }[e.key];
          if (offset !== undefined) {
            e.preventDefault();
            mapAnchor = null;
            mapVelocity = 0;
            mapScroll = clamp(mapScroll + offset, 0, max);
          }
        }
        render();
      });
      document.addEventListener("visibilitychange", () => {
        last = 0;
        acc = 0;
        if (document.hidden) {
          if (finger?.slider) persist();
          finger = null;
          mapVelocity = 0;
          stopAiming();
          suspendAudio();
          if (encore) encore.running = false;
          if (screen === "play" && !modal) modal = "pause";
        } else if (!modal && ac) wake();
      });
      window.addEventListener("resize", resize);
      function finishLettering() {
        if (!document.fonts) return;
        Promise.allSettled([
          document.fonts.load("bold 96px Rye"),
          document.fonts.load("700 16px " + cond),
          document.fonts.load("400 14px " + sans),
        ]).then(() => {
          backgroundCache.delete("poster");
          for (const key of backgroundCache.keys())
            if (key.startsWith("stage-")) backgroundCache.delete(key);
        });
      }
      const lettering = document.getElementById("stage-fonts");
      if (lettering.sheet) finishLettering();
      else lettering.addEventListener("load", finishLettering, { once: true });
      // The carnival site can hand visitors directly to a mission or a mode's map.
      function enterFromTicket() {
        const ticket = new URLSearchParams(location.search);
        const selected = [
          "adventure",
          "free-play",
          "score-attack",
          "seeded",
        ].indexOf(ticket.get("mode"));
        if (selected < 0) return;
        mode = selected;
        if (mode === 0) {
          enterAdventure(false);
        } else {
          const boardId = ticket.get("mission") || "",
            number = ticket.get("seed") || "",
            world = ticket.get("world") || "";
          const cast = names.findIndex(
            (name) => name.toLowerCase() === ticket.get("performer"),
          );
          const validBoard = /^([1-9]|[1-3]\d|40)$/.test(boardId),
            validSeed =
              /^\d{1,10}$/.test(number) && Number(number) <= 4294967295;
          if (validBoard && (mode !== 3 || validSeed)) {
            chosen = Number(boardId) - 1;
            hero = cast >= 0 ? cast : Math.floor(chosen / 5);
            if (mode === 3) seed = Number(number);
            start(false);
          } else if (mode === 1 && /^[1-8]$/.test(world)) {
            hero = Number(world) - 1;
            chosen = hero * 5;
            start(false);
          } else openMap(mode);
        }
      }
      resize();
      enterFromTicket();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
